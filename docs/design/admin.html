<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Happow admin screens</title>
    <style>
      /* Design reference for M8 slice F (the admin panel: sign-in code requests and premium grants).
   Draft for the owner's OK, 2026-10-24. Tokens are config/theme.json; layout and type follow
   apps/web/src/styles.css (Screen, mod-card, segmented, btn, field) and docs/design/account.html.
   Touch-first: no hover styles.
   M12 slice C2 (draft for the owner's OK, 2026-10-28): a fourth admin tab, Sources, for the
   website check's candidates (docs/milestones/M12-more-events.md §2.2). Same cards, buttons and
   tokens; no new icons. */
      :root {
        --paper: #fbfaf7;
        --paper-2: #eeeae2;
        --ink: #17171a;
        --muted: #86807a;
        --quiet: #5c5852;
        --line: #dfd8cc;
        --scrim: rgba(23, 23, 26, 0.42);
        --error: #fbe3e1;
        --error-ink: #9b1c1c;
      }
      .night {
        --paper: #1a1d23;
        --paper-2: #242832;
        --ink: #ece9e3;
        --muted: #80838b;
        --quiet: #a9acb3;
        --line: #323846;
        --scrim: rgba(0, 0, 0, 0.6);
        --error: #3d1a1c;
        --error-ink: #ffb4b4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px 16px 40px;
        background: #f4f3ef;
        font:
          15px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #17171a;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        margin: 0 auto 10px;
        max-width: 760px;
      }
      .controls button {
        font: inherit;
        font-size: 13px;
        padding: 6px 10px;
        border: 1px solid #c9c6bf;
        border-radius: 8px;
        background: #fff;
        color: #17171a;
      }
      .controls button[aria-pressed='true'] {
        background: #17171a;
        color: #fff;
        border-color: #17171a;
      }
      .controls .sep {
        width: 100%;
        height: 0;
      }
      .cap {
        max-width: 380px;
        margin: 10px auto 0;
        font-size: 12.5px;
        color: #6b6b66;
        text-align: center;
      }

      /* The phone */
      .ph {
        position: relative;
        width: 380px;
        max-width: 100%;
        height: 760px;
        margin: 0 auto;
        border: 6px solid #8a8a86;
        border-radius: 26px;
        overflow: hidden;
        background: var(--paper-2);
        color: var(--ink);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .bar h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--ink);
        padding: 0;
      }
      .scroll {
        position: absolute;
        top: 61px;
        bottom: 0;
        left: 0;
        right: 0;
        overflow-y: auto;
      }
      .body {
        padding: 14px 16px 32px;
      }
      .muted {
        color: var(--muted);
      }
      svg {
        display: block;
      }

      /* Tabs: the app's segmented control, three across */
      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 3px;
        padding: 3px;
        margin: 0 0 12px;
        background: var(--line);
        border-radius: 12px;
      }
      .seg button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 38px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
      }
      .seg button.on {
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }
      .seg2 {
        grid-template-columns: 1fr 1fr;
        margin: 0;
      }
      .seg4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .seg4 button {
        gap: 4px;
        font-size: 13.5px;
      }

      /* Sources (M12 C2): a candidate's site, its samples, and the paused line */
      .site {
        display: block;
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--quiet);
        text-decoration: underline;
        text-underline-offset: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .samples {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--line);
      }
      .samples li {
        display: flex;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13.5px;
      }
      .samples time {
        flex: none;
        width: 92px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .samples span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .more {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .count {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--ink);
        color: var(--paper);
        font-size: 11px;
        font-weight: 700;
        line-height: 18px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      /* The bar under the tabs (the app's mod-bar) */
      .mod-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .mod-bar .who {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        color: var(--muted);
      }
      h2 {
        margin: 18px 0 10px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }

      /* Cards (the app's mod-card) */
      .card {
        margin-bottom: 10px;
        padding: 12px 14px 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
      }
      .card--ended {
        opacity: 0.55;
      }
      .card__top {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .card__email {
        flex: 1;
        min-width: 0;
        margin: 0;
        font-size: 15.5px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lang {
        flex: none;
        padding: 1px 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--quiet);
      }
      .meta {
        margin: 3px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .made {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 4px 0 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }
      .plan {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 3px 0 0;
        font-size: 13px;
        color: var(--quiet);
      }
      .quote {
        margin: 8px 0 0;
        padding: 4px 10px;
        border-left: 3px solid var(--line);
        font-size: 13px;
        color: var(--ink);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .actions .btn {
        flex: 0 1 auto;
        min-width: 150px;
      }
      .spacer {
        flex: 1;
      }

      .btn {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 42px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn--primary {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
      }
      .btn--inline {
        flex: none;
        height: 36px;
        padding: 0 12px;
        font-size: 13px;
      }
      .btn--block {
        width: 100%;
      }
      .btn--danger {
        background: var(--error);
        border-color: var(--error);
        color: var(--error-ink);
      }
      /* The quiet action: a text button with a 36 px touch area */
      .quiet {
        min-height: 36px;
        padding: 0 6px;
        border: 0;
        background: none;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--quiet);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .quiet--danger {
        color: var(--error-ink);
      }
      .copy-btn {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        color: var(--ink);
        padding: 0;
      }
      .form-error {
        margin: 8px 0 0;
        padding: 8px 10px;
        border-radius: 10px;
        background: var(--error);
        color: var(--error-ink);
        font-size: 13px;
      }
      .empty {
        margin: 40px 0;
        text-align: center;
        color: var(--muted);
      }
      .empty svg {
        margin: 0 auto 8px;
      }

      /* Sheets */
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--scrim);
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 92%;
        overflow-y: auto;
        padding: 8px 18px 22px;
        border-radius: 22px 22px 0 0;
        background: var(--paper);
        box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
      }
      .grab {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--line);
        margin: 0 auto 12px;
      }
      .sheet h3 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 6px;
        font-size: 19px;
        letter-spacing: -0.01em;
      }
      .sheet p {
        margin: 0 0 14px;
        color: var(--quiet);
      }
      .bigcode {
        margin: 4px 0 14px;
        padding: 12px 10px 10px;
        border-radius: 14px;
        background: var(--paper-2);
        text-align: center;
      }
      .bigcode__num {
        font-size: 40px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: 0.12em;
        font-variant-numeric: tabular-nums;
        user-select: all;
      }
      .bigcode__num span {
        display: inline-block;
        width: 0.35em;
      }
      .bigcode__for {
        margin-top: 2px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .ro {
        margin: 0 0 12px;
      }
      .ro__label {
        display: block;
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .ro__line {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ro__value {
        flex: 1;
        min-width: 0;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper-2);
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .ro__body {
        max-height: 150px;
        overflow-y: auto;
        margin: 0;
        white-space: pre-wrap;
        font: inherit;
        font-size: 13px;
        line-height: 1.45;
      }
      .ro__body.selected {
        background: color-mix(in srgb, var(--ink) 14%, var(--paper-2));
      }
      .hint {
        margin: 6px 0 0;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .note {
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--paper-2);
        font-size: 13px;
        color: var(--ink);
        margin: 12px 0 12px;
      }

      /* Fields */
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0 0 14px;
      }
      .field__label {
        font-size: 13px;
        font-weight: 700;
      }
      .field__hint {
        font-size: 12px;
        color: var(--muted);
      }
      .field__error {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--error-ink);
      }
      .field input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        font: inherit;
        font-size: 16px;
        color: var(--ink);
      }
      .field input.bad {
        border-color: var(--error-ink);
      }
      .night input[type='date'] {
        color-scheme: dark;
      }

      /* The mock moderation queue, as the app draws it today */
      .badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 999px;
        background: var(--paper-2);
      }
      .cats {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .card h4 {
        margin: 4px 0;
        font-size: 16px;
      }
    </style>
  </head>

        const c = document.getElementById('ctl');
        const b = (label, on, fn) => {
          const x = document.createElement('button');
          x.type = 'button';
          x.textContent = label;
          x.setAttribute('aria-pressed', String(on));
          x.onclick = () => {
            fn();
            render();
          };
          return x;
        };
        c.innerHTML = '';
        SCREENS.forEach(([id, label]) =>
          c.append(b(label, st.screen === id, () => (st.screen = id))),
        );
        c.append(Object.assign(document.createElement('span'), { className: 'sep' }));
        c.append(
          b('Day', !st.dark, () => (st.dark = false)),
          b('Night', st.dark, () => (st.dark = true)),
          b('PL', st.lang === 'pl', () => (st.lang = 'pl')),
          b('EN', st.lang === 'en', () => (st.lang = 'en')),
        );
      }
      render();
    </script>
  </body>
</html>
