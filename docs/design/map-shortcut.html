<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happow map shortcut chip</title>
<style>
body{margin:0;padding:24px 16px;background:#f4f3ef;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#17171a}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ph{position:relative;width:340px;max-width:100%;height:420px;margin:0 auto;border-radius:22px;border:6px solid #8a8a86;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ph *{box-sizing:border-box}
.ph button{margin:0;font:inherit;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.n{font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#fan{animation:rise .16s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){#fan{animation:none}}
#bd[aria-pressed="true"],#bn[aria-pressed="true"]{font-weight:700}
</style>
</head>
<body>
<!-- Proposal for M6 slice G (2026-10-23), waiting for the owner's OK: the chip beside the live counter
     is a shortcut to one filter the user picks. Tap = on / off; hold = choose what it does. -->
<h1 class="sr-only">Map shortcut chip: a round button beside the live counter. Tap toggles its filter; a long press opens a grid of family mode and the categories to choose from.</h1>
<div style="display:flex;gap:6px;justify-content:center;margin:0 0 12px"><button id="bd" type="button">Day</button><button id="bn" type="button">Night</button></div>
<div class="ph" id="ph">
<div id="map" style="position:absolute;inset:0"></div>
<button id="cnt" class="n" type="button" aria-label="Show only what is on now" style="position:absolute;z-index:8;left:12px;top:12px;width:76px;height:38px;padding:0 12px;border-radius:19px;display:flex;align-items:center;justify-content:center;gap:8px;border-style:solid;border-width:.5px;font-size:17px;font-weight:600"></button>
<button id="chip" type="button" style="position:absolute;z-index:8;top:12px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border-style:solid;border-width:.5px"></button>
<button id="filt" type="button" aria-label="Settings" style="position:absolute;z-index:8;top:12px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border-style:solid;border-width:.5px;left:232px"></button>
<button id="dice" type="button" aria-label="Surprise me" style="position:absolute;z-index:8;top:12px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border-style:solid;border-width:.5px;left:278px"></button>
<div id="fan" role="radiogroup" aria-label="Shortcut" hidden style="position:absolute;z-index:9;left:12px;right:12px;top:60px;padding:8px;border-radius:16px;border-style:solid;border-width:.5px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px"></div>
</div>
<p style="font-size:12.5px;text-align:center;margin:8px 0 0;color:#6b6b66">Tap the chip: its filter on / off. Hold it: choose family mode or one category. Remembered on the device.</p>
<p id="cap" style="font-size:12.5px;text-align:center;margin:4px 0 0;color:#6b6b66"></p>
<script>
const P={"note":{"from":"music","paths":["M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0","M13 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0","M9 17v-13h10v13","M9 8h10"]},"mask":{"from":"masks-theater","paths":["M13.192 9h6.616a2 2 0 0 1 1.992 2.183l-.567 6.182a4 4 0 0 1 -3.983 3.635h-1.5a4 4 0 0 1 -3.983 -3.635l-.567 -6.182a2 2 0 0 1 1.992 -2.183","M15 13h.01","M18 13h.01","M15 16.5c1 .667 2 .667 3 0","M8.632 15.982a4.037 4.037 0 0 1 -.382 .018h-1.5a4 4 0 0 1 -3.983 -3.635l-.567 -6.182a2 2 0 0 1 1.992 -2.183h6.616a2 2 0 0 1 2 2","M6 8h.01","M9 8h.01","M6 12c.764 -.51 1.528 -.63 2.291 -.36"]},"film":{"from":"movie","paths":["M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12","M8 4l0 16","M16 4l0 16","M4 8l4 0","M4 16l4 0","M4 12l16 0","M16 8l4 0","M16 16l4 0"]},"frame":{"from":"photo","paths":["M15 8h.01","M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12","M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5","M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3"]},"confetti":{"from":"confetti","paths":["M4 5h2","M5 4v2","M11.5 4l-.5 2","M18 5h2","M19 4v2","M15 9l-1 1","M18 13l2 -.5","M18 19h2","M19 18v2","M14 16.518l-6.518 -6.518l-4.39 9.58a1 1 0 0 0 1.329 1.329l9.579 -4.39"]},"spark":{"from":"sparkles","paths":["M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2m0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2m-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6"]},"run":{"from":"run","paths":["M11.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0","M4 17l5 1l.75 -1.5","M15 21v-4l-4 -3l1 -6","M7 12v-3l5 -1l3 3l3 1"]},"basket":{"from":"basket","paths":["M10 14a2 2 0 1 0 4 0a2 2 0 0 0 -4 0","M5.001 8h13.999a2 2 0 0 1 1.977 2.304l-1.255 7.152a3 3 0 0 1 -2.966 2.544h-9.512a3 3 0 0 1 -2.965 -2.544l-1.255 -7.152a2 2 0 0 1 1.977 -2.304","M17 10l-2 -6","M7 10l2 -6"]},"tag":{"paths":["M3 3h9l9 9l-9 9l-9 -9z","M6.5 8a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0"]},"horse":{"from":"horse-toy","paths":["M3.5 17.5c5.667 4.667 11.333 4.667 17 0","M19 18.5l-2 -8.5l1 -2l2 1l1.5 -1.5l-2.5 -4.5c-5.052 .218 -5.99 3.133 -7 6h-6a3 3 0 0 0 -3 3","M5 18.5l2 -9.5","M8 20l2 -5h4l2 5"]},"utensils":{"from":"tools-kitchen-2","paths":["M19 3v12h-5c-.023 -3.681 .184 -7.406 5 -12m0 12v6h-1v-3m-10 -14v17m-3 -17v3a3 3 0 1 0 6 0v-3"]},"mic":{"paths":["M9 7a3 3 0 0 1 6 0v5a3 3 0 0 1 -6 0z","M6 11q0 6.5 6 6.5q6 0 6 -6.5","M12 17.5v3.5"]},"candle":{"paths":["M8.5 10h7v11h-7z","M12 10v-2","M12 2.5q3.5 3.5 0 5q-3.5 -1.5 0 -5"]},"dot":{"fill":true,"paths":["M8.5 12a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0"]},"family":{"paths":["M5 7a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0","M3.5 21v-5a4 4 0 0 1 8 0v5","M15.2 11a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0","M14 21v-3a3 3 0 0 1 6 0v3"]},"dice":{"paths":["M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14"],"dots":[[8.5,8.5],[15.5,8.5],[12,12],[8.5,15.5],[15.5,15.5]]},"sliders":{"paths":["M12 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0","M4 6l8 0","M16 6l4 0","M6 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0","M4 12l2 0","M10 12l10 0","M15 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0","M4 18l11 0","M19 18l1 0"]}};
const O=[{"id":"family","g":"family","en":"Family mode"},{"id":"music","g":"note","en":"Music"},{"id":"theatre","g":"mask","en":"Theatre"},{"id":"cinema","g":"film","en":"Cinema"},{"id":"exhibition","g":"frame","en":"Exhibition"},{"id":"festival","g":"confetti","en":"Festival"},{"id":"happening","g":"spark","en":"Happening"},{"id":"sport","g":"run","en":"Sport"},{"id":"market","g":"basket","en":"Market & fair"},{"id":"garage-sale","g":"tag","en":"Garage sale"},{"id":"kids","g":"horse","en":"Kids & family"},{"id":"food","g":"utensils","en":"Food"},{"id":"talk","g":"mic","en":"Talks & workshops"},{"id":"religious","g":"candle","en":"Religious & ceremonies"},{"id":"other","g":"dot","en":"Other"}];
const DAY={"bg":"#F1ECE2","minor":"#E3DACA","ink":"#17171A","muted":"#86807A","paper":"#FBFAF7","line":"#DFD8CC","live":"#6A4CF5"};
const NIGHT={"bg":"#000000","minor":"#1C2230","ink":"#ECE9E3","muted":"#80838B","paper":"#1A1D23","line":"#323846","live":"#8C74FF"};
const svg=(k,s,sw=2)=>{const g=P[k];const d=g.paths.map(p=>'<path d="'+p+'"'+(g.fill?' fill="currentColor" stroke="none"':'')+'/>').join('')+(g.dots||[]).map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="1" fill="currentColor" stroke="none"/>').join('');return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>'};
const st={dark:false,pick:'family',on:false,fan:false};
const $=id=>document.getElementById(id);
const count=()=>st.on?3+(O.findIndex(o=>o.id===st.pick)*7)%9:14;
function render(){const C=st.dark?NIGHT:DAY,o=O.find(x=>x.id===st.pick);
$('ph').style.background=C.bg;
$('map').innerHTML='<svg width="100%" height="100%" aria-hidden="true"><path d="M0 140H340M0 260H340M90 0V420M230 0V420" stroke="'+C.minor+'" stroke-width="10"/></svg>';
const btn=(el,on)=>{el.style.background=on?C.ink:C.paper;el.style.borderColor=on?C.ink:C.line;el.style.color=on?C.paper:C.ink};
const c=$('cnt');c.style.background=C.paper;c.style.borderColor=C.line;c.style.color=C.ink;
c.innerHTML='<span style="width:9px;height:9px;border-radius:50%;background:'+C.live+'"></span><span>'+count()+'</span>';
const ch=$('chip');ch.style.left='96px';btn(ch,st.on);ch.innerHTML=svg(o.g,20);
ch.setAttribute('aria-pressed',String(st.on));ch.setAttribute('aria-label',o.en);
btn($('filt'),false);$('filt').innerHTML=svg('sliders',19);btn($('dice'),false);$('dice').innerHTML=svg('dice',19);
const f=$('fan');f.style.display=st.fan?'grid':'none';f.style.background=C.paper;f.style.borderColor=C.line;
f.innerHTML=O.map(x=>{const cur=x.id===st.pick;return '<button type="button" role="radio" aria-checked="'+cur+'" aria-label="'+x.en+'" data-id="'+x.id+'" style="height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:transparent;border:'+(cur?'1.5px solid '+C.ink:'.5px solid transparent')+';color:'+C.ink+'">'+svg(x.g,22)+'</button>'}).join('');
$('cap').textContent='Shortcut: '+o.en+(st.on?' (on)':' (off)');
$('bd').setAttribute('aria-pressed',String(!st.dark));$('bn').setAttribute('aria-pressed',String(st.dark));}
let timer=null,held=false;
$('chip').addEventListener('pointerdown',()=>{held=false;timer=setTimeout(()=>{held=true;st.fan=true;if(navigator.vibrate)navigator.vibrate(6);render()},500)});
$('chip').addEventListener('pointerup',()=>{clearTimeout(timer);if(!held){if(st.fan)st.fan=false;else st.on=!st.on;render()}});
$('chip').addEventListener('pointerleave',()=>clearTimeout(timer));
$('chip').addEventListener('contextmenu',e=>e.preventDefault());
$('fan').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;st.pick=b.dataset.id;st.on=true;st.fan=false;render()});
$('map').addEventListener('click',()=>{if(st.fan){st.fan=false;render()}});
$('bd').onclick=()=>{st.dark=false;render()};$('bn').onclick=()=>{st.dark=true;render()};
render();
</script>
</body>
</html>
