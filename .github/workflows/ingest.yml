name: Ingest sources

# Started by the Worker's Cron Trigger (every 15 min, only when a source is due; see
# packages/api/src/schedule.ts), by hand, or by the fallback schedule below. Each source's own
# `schedule` in config/sources.json decides whether it is due (tracked in the source_runs table).
# Sources whose secrets are missing are skipped and recorded, so the Worker backs off for a day.
# The Worker names the regions with something due; each gets its own job, side by side, so more
# cities do not make one job run past its timeout. Without regions, one job runs them all.
on:
  schedule:
    # Fallback only, in case the Worker cannot dispatch (token missing or expired). Once a day:
    # every run of a private repo counts against the Actions minutes, even when nothing is due.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      regions:
        description: 'JSON list of region ids, one job each (e.g. ["wroclaw","krakow"]); empty = all in one job'
        type: string
        default: ''
      source:
        description: Only this source id (e.g. ticketmaster); empty = all
        type: string
        default: ''
      force:
        description: Run even if not due
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        region: ${{ fromJSON(inputs.regions || '["all"]') }}
    # One job fetches its region's due sources in turn (the Wrocław city portal alone takes about
    # 20 min). Each job bills the minutes it uses, rounded up to a whole minute.
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      MEETUP_CLIENT_KEY: ${{ secrets.MEETUP_CLIENT_KEY }}
      MEETUP_MEMBER_ID: ${{ secrets.MEETUP_MEMBER_ID }}
      MEETUP_SIGNING_KEY_ID: ${{ secrets.MEETUP_SIGNING_KEY_ID }}
      MEETUP_PRIVATE_KEY: ${{ secrets.MEETUP_PRIVATE_KEY }}
      # LLM fallback for crawled pages without structured data (sources with llmFallback).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Threads keyword search (source off in config until Meta App Review).
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      REGION: ${{ matrix.region != 'all' && matrix.region || '' }}
      SOURCE: ${{ inputs.source }}
      FORCE: ${{ inputs.force && '1' || '' }}
    steps:
      - if: env.DATABASE_URL == ''
        run: echo "::notice::DATABASE_URL secret is not set; skipping ingestion."
      - if: env.DATABASE_URL != ''
        uses: actions/checkout@v4
      - if: env.DATABASE_URL != ''
        uses: pnpm/action-setup@v4
      - if: env.DATABASE_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: env.DATABASE_URL != ''
        run: pnpm install --frozen-lockfile
      - if: env.DATABASE_URL != ''
        # Inputs arrive through env, never interpolated into the script.
        run: pnpm ingest ${REGION:+--region "$REGION"} ${SOURCE:+--source "$SOURCE"} ${FORCE:+--force}
